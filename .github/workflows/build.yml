name: Build Publy App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install naver-bot dependencies
        working-directory: naver-bot
        run: npm install

      - name: Bundle naver-bot (esbuild)
        working-directory: naver-bot
        run: npx esbuild src/server.ts --bundle --platform=node --target=node20 --outfile=dist/server.js --external:playwright --external:fs-extra

      - name: Install Playwright Chromium
        working-directory: naver-bot
        run: npx playwright install chromium

      - name: Install app dependencies
        run: npm install

      - name: Build Electron main process
        run: npx tsc -p electron/tsconfig.json

      - name: Build & Package
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Publy-Windows
          path: release/*.exe
          retention-days: 30
