name: Build Publy App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 봇 서버 빌드
      - name: Install naver-bot dependencies
        working-directory: naver-bot
        run: npm install

      - name: Build naver-bot
        working-directory: naver-bot
        run: npx tsc

      - name: Install Playwright Chromium
        working-directory: naver-bot
        run: npx playwright install chromium

      # 프론트엔드 + Electron 빌드
      - name: Install app dependencies
        run: npm install

      - name: Build Electron main process
        run: npx tsc -p electron/tsconfig.json

      - name: Build & Package
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # .exe 파일 업로드
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Publy-Windows
          path: release/*.exe
          retention-days: 30
