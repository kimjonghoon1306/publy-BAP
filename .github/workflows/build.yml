name: Build Publy App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install naver-bot dependencies
        working-directory: naver-bot
        run: npm install

      - name: Bundle naver-bot (esbuild)
        working-directory: naver-bot
        run: npx esbuild src/server.ts --bundle --platform=node --target=node20 --outfile=dist/server.js --external:playwright

      - name: Install neighbor-bot dependencies
        working-directory: neighbor-bot
        run: npm install

      - name: Bundle neighbor-bot (esbuild)
        working-directory: neighbor-bot
        run: npx esbuild src/server.ts --bundle --platform=node --target=node20 --outfile=dist/server.js --external:playwright
        env:
          NODE_PATH: ../naver-bot/node_modules

      - name: Install insta-bot dependencies
        working-directory: insta-bot
        run: npm install

      - name: Bundle insta-bot (esbuild)
        working-directory: insta-bot
        run: npx esbuild src/server.ts --bundle --platform=node --target=node20 --outfile=dist/server.js --external:playwright
        env:
          NODE_PATH: ../naver-bot/node_modules

      - name: Install Playwright Chromium (naver-bot)
        working-directory: naver-bot
        run: npx playwright install chromium

      - name: Install Playwright Chromium (neighbor-bot)
        working-directory: neighbor-bot
        run: npx playwright install chromium

      - name: Copy Chromium to bundle path
        shell: pwsh
        run: |
          $chromiumSrc = $env:LOCALAPPDATA + '\ms-playwright'
          if (Test-Path $chromiumSrc) {
            Write-Host "Chromium found at: $chromiumSrc"
            New-Item -ItemType Directory -Force -Path 'chromium' | Out-Null
            Get-ChildItem "$chromiumSrc" -Directory | Where-Object { $_.Name -like 'chromium-*' -or $_.Name -like 'chromium_headless_shell-*' } | ForEach-Object {
              Copy-Item -Recurse -Force $_.FullName 'chromium/'
              Write-Host "Copied: $($_.Name)"
            }
            Write-Host "Final chromium dir:"
            Get-ChildItem 'chromium/' | Select-Object Name
          } else {
            Write-Host "Chromium not found at $chromiumSrc, skipping"
          }

      - name: Install app dependencies
        run: npm install

      - name: Build Electron main process
        run: npx tsc -p electron/tsconfig.json

      - name: Build & Package
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Publy-Windows
          path: release/*.exe
          retention-days: 30

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Publy Latest
          files: release/*.exe
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install naver-bot dependencies
        working-directory: naver-bot
        run: npm install

      - name: Bundle naver-bot (esbuild)
        working-directory: naver-bot
        run: npx esbuild src/server.ts --bundle --platform=node --target=node20 --outfile=dist/server.js --external:playwright

      - name: Install neighbor-bot dependencies
        working-directory: neighbor-bot
        run: npm install

      - name: Bundle neighbor-bot (esbuild)
        working-directory: neighbor-bot
        run: npx esbuild src/server.ts --bundle --platform=node --target=node20 --outfile=dist/server.js --external:playwright
        env:
          NODE_PATH: ../naver-bot/node_modules

      - name: Install insta-bot dependencies
        working-directory: insta-bot
        run: npm install

      - name: Bundle insta-bot (esbuild)
        working-directory: insta-bot
        run: npx esbuild src/server.ts --bundle --platform=node --target=node20 --outfile=dist/server.js --external:playwright
        env:
          NODE_PATH: ../naver-bot/node_modules

      - name: Install Playwright Chromium (naver-bot)
        working-directory: naver-bot
        run: npx playwright install chromium

      - name: Install Playwright Chromium (neighbor-bot)
        working-directory: neighbor-bot
        run: npx playwright install chromium

      - name: Copy Chromium to bundle path (macOS)
        run: |
          CHROMIUM_SRC="$HOME/Library/Caches/ms-playwright"
          if [ -d "$CHROMIUM_SRC" ]; then
            echo "Chromium found at: $CHROMIUM_SRC"
            mkdir -p chromium
            for dir in "$CHROMIUM_SRC"/chromium-* "$CHROMIUM_SRC"/chromium_headless_shell-*; do
              if [ -d "$dir" ]; then
                cp -r "$dir" chromium/
                echo "Copied: $(basename $dir)"
              fi
            done
            echo "Final chromium dir contents:"
            ls chromium/
          else
            echo "Chromium not found, skipping"
          fi

      - name: Install app dependencies
        run: npm install

      - name: Build Electron main process
        run: npx tsc -p electron/tsconfig.json

      - name: Build & Package
        run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Ad-hoc sign apps and repackage DMGs (fix "damaged")
        run: |
          set -e
          # 1) electron-builder가 만든 앱은 서명이 깨져있음(linker stub) → 유효 ad-hoc으로 재서명
          for app in release/mac-arm64/*.app release/mac-x64/*.app release/mac/*.app; do
            [ -d "$app" ] || continue
            echo "signing: $app"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            echo "  valid signature: $app"
          done
          # 2) DMG는 서명 '전'에 만들어졌으므로, 서명된 앱으로 DMG를 다시 굽는다
          repack() {
            appdir="$1"; dmg="$2"
            app=$(ls -d "$appdir"/*.app 2>/dev/null | head -1)
            [ -n "$app" ] && [ -d "$app" ] || return 0
            [ -f "$dmg" ] || return 0
            echo "repacking $dmg  <=  $app"
            rm -f "$dmg"
            stage=$(mktemp -d)
            cp -R "$app" "$stage/"
            ln -s /Applications "$stage/Applications"
            hdiutil create -volname "Publy" -srcfolder "$stage" -ov -format UDZO "$dmg"
            rm -rf "$stage"
          }
          for dmg in release/*-arm64.dmg; do [ -f "$dmg" ] && repack release/mac-arm64 "$dmg"; done
          for dmg in release/*.dmg; do
            case "$dmg" in
              *-arm64.dmg) : ;;
              *) if [ -d release/mac-x64 ]; then repack release/mac-x64 "$dmg"; else repack release/mac "$dmg"; fi ;;
            esac
          done
          # 3) 검증: DMG 안 앱이 유효 서명이어야 다운로드시 "손상됨" 대신 "확인할 수 없음(그래도 열기 가능)"으로 뜸
          for dmg in release/*.dmg; do
            hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/vchk >/dev/null 2>&1 || continue
            if codesign --verify --deep --strict /tmp/vchk/*.app >/dev/null 2>&1; then
              echo "DMG OK (valid signature): $dmg"
            else
              echo "DMG STILL BROKEN: $dmg"; hdiutil detach /tmp/vchk >/dev/null 2>&1 || true; exit 1
            fi
            hdiutil detach /tmp/vchk >/dev/null 2>&1 || true
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Publy-Mac
          path: release/*.dmg
          retention-days: 30

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Publy Latest
          files: release/*.dmg
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
