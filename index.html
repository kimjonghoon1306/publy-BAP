  <body>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(r => console.log('[PWA] SW 등록됨', r.scope))
            .catch(e => console.log('[PWA] SW 실패', e));
        });
