<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc66"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="192" height="192" rx="36" fill="url(#bg)"/>

  <!-- 배경 서클 장식 -->
  <circle cx="96" cy="96" r="72" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.12"/>
  <circle cx="96" cy="96" r="55" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.08"/>

  <!-- P 글자 - 굵고 현대적 -->
  <text x="96" y="126" 
    font-family="Arial Black, sans-serif" 
    font-size="108" 
    font-weight="900"
    fill="url(#g1)" 
    text-anchor="middle"
    filter="url(#glow)"
    letter-spacing="-4">P</text>

  <!-- 하단 브랜드명 -->
  <rect x="44" y="148" width="104" height="20" rx="10" fill="#00ff88" opacity="0.12"/>
  <text x="96" y="163"
    font-family="Arial, sans-serif"
    font-size="11"
    font-weight="700"
    fill="#00ff88"
    text-anchor="middle"
    letter-spacing="4">PUBLY</text>
</svg>
