<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUBLY 배경 시안</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#eee;font-family:-apple-system,'Malgun Gothic',sans-serif;padding:24px;min-height:100vh}
h1{font-size:18px;font-weight:800;letter-spacing:.05em;margin-bottom:4px}
p.sub{font-size:13px;color:#888;margin-bottom:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:#111;border:1px solid #222;border-radius:14px;overflow:hidden}
.card img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.card .label{padding:12px 16px;font-size:14px;font-weight:700}
.card .label b{color:#fb7185}
.card .desc{padding:0 16px 14px;font-size:12px;color:#999}
</style></head>
<body>
<h1>PUBLY 인트로 배경 — 시안 A / B</h1>
<p class="sub">블로그오토프로 톤(검은 배경·3D·네온 글로우)을 퍼블리 핑크로. 마음에 드는 걸 고르면 이 이미지를 움직이는 영상으로 만듭니다.</p>
<div class="grid">
  <div class="card"><img src="intro-assets/publy-A.png"><div class="label"><b>A</b> · 광택 3D 리본 매듭</div><div class="desc">블로그오토프로 인트로에 가장 가까운 형태. 고급스럽고 정돈된 느낌.</div></div>
  <div class="card"><img src="intro-assets/publy-B.png"><div class="label"><b>B</b> · 흐르는 실크 웨이브</div><div class="desc">더 부드럽고 역동적. 배경이 흐르는 모션에 유리.</div></div>
</div>
</body></html>
